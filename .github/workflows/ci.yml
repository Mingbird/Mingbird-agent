name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install pytest
          pip install requests beautifulsoup4
      - name: Run unit tests
        shell: bash
        run: |
          rc=0
          python -m pytest tests/ -q -ra --tb=short > pytest_out.txt 2>&1 || rc=$?
          cat pytest_out.txt
          {
            echo "### pytest output (${{ matrix.python-version }})"
            echo '<pre>'
            cat pytest_out.txt
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Syntax check core modules
        run: |
          python -m py_compile ollama_agent.py
          python -m py_compile agent_gui.py
