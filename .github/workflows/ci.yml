name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install pytest
          pip install requests beautifulsoup4
          # v2.0.x 测试面新增:GUI 逻辑测试 import agent_gui(必需 ttkbootstrap);
          # run_python 环境测试要求 python-docx 可导入。缺这两味 = v2.0.0 起 CI 全红。
          pip install ttkbootstrap python-docx
      - name: Run unit tests
        shell: bash
        run: |
          rc=0
          python -m pytest tests/ -q -ra --tb=short > pytest_out.txt 2>&1 || rc=$?
          cat pytest_out.txt
          {
            echo "### pytest output (${{ matrix.python-version }})"
            echo '<pre>'
            cat pytest_out.txt
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          # 失败行转 ::error 注释:check-runs annotations 走 API 就能读,定位失败
          # 不再依赖网页日志权限(2026-10-07 v2.0.3 CI 排障实测 GCM token 拉不到日志)
          grep -E "^(FAILED|ERROR)" pytest_out.txt | head -20 | while IFS= read -r line; do
            echo "::error title=pytest ${{ matrix.python-version }}::${line}"
          done
          exit $rc
      - name: Syntax check core modules
        run: |
          python -m py_compile ollama_agent.py
          python -m py_compile agent_gui.py
