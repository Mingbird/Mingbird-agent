name: build-desktop

# Build experimental macOS / Linux packages and attach them to the tag's
# release. Windows installers are built locally (Inno Setup).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach (e.g. v1.4.0)"
        required: true
        default: "v1.4.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, arch: macos-x64 }
          - { os: macos-14, arch: macos-arm64 }
          - { os: ubuntu-22.04, arch: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 从 dispatch 指定的 tag 构建(不钉 ref 会构建 main;tag 与 main 有分叉时
          # unix 包就不等于 tag 源码,违背"Windows 包从 tag 构建"的同一纪律)
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 tk8.6 binutils xvfb

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ttkbootstrap tkinterdnd2 pillow requests numpy sherpa_onnx mcp beautifulsoup4 sounddevice soundfile openpyxl python-docx

      - name: Fetch STT model (optional, voice input)
        run: |
          # spec 的 datas 含 ('stt','stt'):目录必须存在,否则 PyInstaller 直接报错
          # (P0:全新 checkout 无 stt/,三个平台 Build 全炸)。模型解进 stt/,
          # 下载失败时留空目录 = 语音降级为 No Audio,构建继续。
          # v1.9.1: 中英双模型,只保留 int8 权重(float32 无人加载,白占 ~50MB)
          mkdir -p stt
          curl -sL -o stt.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2" || true
          if [ -s stt.tar.bz2 ]; then tar xjf stt.tar.bz2 -C stt; fi   # 不 strip:代码按 stt/<模型名>/ 找
          mkdir -p stt/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.int8.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            curl -sL -o "stt/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17/$f" "https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17/resolve/main/$f" || true
          done
          # 统一清理:非 int8 权重、测试音频、导出脚本一律不进包
          find stt -type f \( -name "*.onnx" ! -name "*int8*" \) -delete 2>/dev/null || true
          rm -rf stt/test_wavs stt/*.sh 2>/dev/null || true
          ls stt/*/ | head -8 || echo "stt model unavailable - voice input will degrade to No Audio"

      - name: Build (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean LocalAgent-unix.spec

      - name: Package
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          PKG="mingbird-${VERSION}-${{ matrix.arch }}.tar.gz"
          cp install-unix.sh dist/
          tar -czf "$PKG" -C dist LocalAgent install-unix.sh
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Smoke (binary stays alive)
        shell: bash
        run: |
          cd dist/LocalAgent
          # linux runner 无显示:用 xvfb 提供虚拟显示再判存活(裸跑必 TclError,
          # 旧判断把"早退"当"可接受",什么都验证不了)
          if [ -n "$(command -v xvfb-run)" ]; then
            xvfb-run -a ./LocalAgent & APP=$!
          else
            ./LocalAgent & APP=$!
          fi
          sleep 8
          if kill -0 "$APP" 2>/dev/null; then echo "smoke: alive"; kill "$APP" || true; else echo "smoke: exited early (see log above)"; exit 1; fi

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          # CI 只往已存在的 release 上传资产,绝不创建 release(创建权在维护者:
          # 用户 token + 模板正文;bot 建的 release 会顶掉模板,v1.9.2 事故)
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG_NAME does not exist yet - create it with the maintainer token and house-template notes first, then dispatch"; exit 1
          fi
          gh release upload "$TAG_NAME" "$PKG" --clobber --repo "$GITHUB_REPOSITORY"
